name: Build classroom models
on:
  workflow_dispatch:
    inputs:
      source_id: {required: true, type: string}
      model_name: {required: true, type: string}
      tiers: {required: true, type: string}
  push:
    branches: [main]
    paths: ['**.glb','**.gltf','**.fbx','**.obj','**.stl','**.ply','**.dae']
permissions: {contents: read}
jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: sudo apt-get update -qq && sudo apt-get install -y blender gltfpack python3-numpy
      - run: python3 tools/catalog_builder.py convert
        env:
          SOURCE_ID: ${{ inputs.source_id }}
          MODEL_NAME: ${{ inputs.model_name }}
          TIERS: ${{ inputs.tiers }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with: {name: converted, path: converted, retention-days: 1}
  publish:
    needs: convert
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    concurrency: {group: update-model-catalog, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: converted, path: converted}
      - run: python3 tools/catalog_builder.py publish
        env:
          GH_TOKEN: ${{ github.token }}


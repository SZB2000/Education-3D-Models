name: Build classroom models
run-name: ${{ inputs.source_id && format('Model upload {0}', inputs.source_id) || 'Build committed models' }}
on:
  workflow_dispatch:
    inputs:
      source_ext: {required: false, type: string}
      source_id: {required: true, type: string}
      model_name: {required: true, type: string}
      tiers: {required: true, type: string}
  push:
    branches: [main]
    paths: ['**.glb','**.gltf','**.fbx','**.obj','**.stl','**.ply','**.dae']
permissions: {contents: read}
jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Restore conversion tool packages
        if: ${{ !(inputs.tiers == 'original' && inputs.source_ext == 'glb') }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/superlab-debs/*.deb
          key: ubuntu24-x64-blender-gltfpack-numpy-v1
      - name: Install conversion tools
        if: ${{ !(inputs.tiers == 'original' && inputs.source_ext == 'glb') }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$HOME/.cache/superlab-debs"
          mkdir -p "$dir"
          shopt -s nullglob
          packages=("$dir"/*.deb)
          if (( ${#packages[@]} )) && sudo apt-get install -y --no-download "${packages[@]}" && command -v blender && command -v gltfpack && /usr/bin/python3 -c 'import numpy'; then
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Dir::Cache::archives="$dir" --download-only install -y blender gltfpack python3-numpy
          sudo apt-get -o Dir::Cache::archives="$dir" -o APT::Keep-Downloaded-Packages=true install -y blender gltfpack python3-numpy
      - run: python3 tools/catalog_builder.py convert
        env:
          SOURCE_ID: ${{ inputs.source_id }}
          MODEL_NAME: ${{ inputs.model_name }}
          TIERS: ${{ inputs.tiers }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with: {name: converted, path: converted, retention-days: 1}
  publish:
    needs: convert
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    concurrency: {group: update-model-catalog, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: converted, path: converted}
      - run: python3 tools/catalog_builder.py publish
        env:
          GH_TOKEN: ${{ github.token }}

